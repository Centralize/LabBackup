[package]
name = "labbackup"
version = "0.1.0"
edition = "2021"
description = "Cross-platform desktop app for backing up and restoring folders"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.18"
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
filetime = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
